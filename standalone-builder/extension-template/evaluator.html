<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doku-Chiwawa 投稿前チェック</title><link rel="stylesheet" href="app.css"></head>
<body class="app-body"><main class="composer-shell">
<header class="topbar"><div class="brand big"><img src="icons/icon48.png" alt=""><div><h1>Doku-Chiwawa</h1><p>投稿前チェック · 6軸ローカル推論</p></div></div><span class="model-chip">Jev7 · INT8</span></header>
<section class="tweet-card"><div class="avatar"><img src="icons/icon48.png" alt=""></div><div class="composer"><textarea id="tweetText" maxlength="5000" placeholder="いまどうしてる？"></textarea><div class="composer-bottom"><div class="fake-tools"><span>▧</span><span>GIF</span><span>☻</span><span>⌖</span></div><div class="actions"><span id="count" class="count">0 / 280</span><button id="evaluate">評価する</button></div></div></div></section>
<div id="status" class="status">モデル未使用。初回評価時にHugging Faceから取得します。</div>
<section id="result" class="result" hidden><div class="result-head"><div><div id="scoreMain" class="score-main"></div><div id="scoreDetail" class="score-detail"></div></div><span id="decisionBadge" class="badge"></span></div><div id="axisChart" class="axis-chart"></div><p class="note">6軸は連続スコアです。0.50はDoku-Chiwawa内の暫定分類閾値で、校正済み確率ではありません。targetedness は毒性そのものではないため分類・グラフから除外しています。</p></section>
<footer>投稿本文は外部推論APIへ送信しません。通信はモデル / tokenizer の初回取得時のみです。</footer>
</main><script type="module" src="evaluator.js"></script></body></html>
