<!doctype html>
<html lang="ja">
<head>

  <link rel="stylesheet" href="app.css">
</head>
<body class="popup-body">

    <p class="tiny">モデルはHFから初回取得。投稿本文はローカル推論。</p>
  </div>
  <script type="module" src="popup.js"></script>
